[package]
name = "se-agent-session"
version = "0.1.0"
description = "Agent sessions (Conversations): contracts, durable storage, migration and lifecycle for Se Manager"
edition = "2021"
rust-version = "1.88"
publish = false

[features]
# Exposes test fixtures and fault-injection hooks to dependents' test builds.
test-support = ["dep:tempfile", "se-foundation/test-support"]

[dependencies]
se-foundation = { path = "../se-foundation" }
se-pty = { path = "../se-pty" }
agent-client-protocol = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
tokio = { version = "1", features = ["full"] }
parking_lot = "0.12"
futures = "0.3"
log = "0.4"
fs2 = "0.4"
sha2 = "0.10"
tempfile = { version = "3", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
se-foundation = { path = "../se-foundation", features = ["test-support"] }
se-pty = { path = "../se-pty", features = ["test-support"] }
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
