[package]
name = "se-ipc"
version = "0.1.0"
description = "Local IPC wire protocol shared by the Se Manager GUI and its Core processes"
edition = "2021"
rust-version = "1.88"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "net", "time", "rt", "macros"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
