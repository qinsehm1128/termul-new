[package]
name = "se-plugin-example"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Configured counter native plugin example"

[lib]
crate-type = ["cdylib"]

[features]
default = []
test-hooks = []
upgrade-fixture = []

[dependencies]
se-plugin-abi = { path = "../se-plugin-abi" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
