[package]
name = "se-foundation"
version = "0.1.0"
description = "Domain-free building blocks shared by the Se Manager app and its Core crates"
edition = "2021"
rust-version = "1.88"
publish = false

[dependencies]
chrono = "0.4"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync"] }
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[features]
# Test-only hooks (e.g. reopening host admission) for dependents' test builds.
test-support = []

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }
