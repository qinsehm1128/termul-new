[package]
name = "se-plugin-host"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Plugin Core native plugin host"

[dependencies]
cordis-core = "=0.6.1"
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "process", "io-util"] }
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
libc = "0.2"
sha2 = "0.10"
semver = "1"
uuid = { version = "1", features = ["v4", "serde"] }
fs2 = "0.4"
log = "0.4"
se-plugin-abi = { path = "../se-plugin-abi" }
se-plugin-protocol = { path = "../se-plugin-protocol" }
se-foundation = { path = "../se-foundation" }

[dev-dependencies]
tempfile = "3"
