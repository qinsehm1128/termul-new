[package]
name = "se-mcp-bridge"
version = "0.1.0"
description = "Gateway settings file and the stdio client that connects an agent to Se Manager's MCP gateway"
edition = "2021"
rust-version = "1.88"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync", "time", "process"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
