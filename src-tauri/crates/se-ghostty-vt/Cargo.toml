[package]
name = "se-ghostty-vt"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "Minimal isolated-process wrapper for pinned Ghostty VT"

[features]
default = []
native = ["dep:cc", "dep:flate2", "dep:sha2", "dep:tar"]

[build-dependencies]
cc = { version = "1", optional = true }
flate2 = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }
tar = { version = "0.4", optional = true }
