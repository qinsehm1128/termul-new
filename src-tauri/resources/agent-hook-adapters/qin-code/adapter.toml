schema_version = 1
id = "qin-code"
display_name = "qin-code"
version = "3.1.0"
[cli]
binaries = ["qin-code", "self-dev"]
version_args = ["--version"]
[cli.version_parser]
kind = "anchored-regex"
pattern = '^(?:qin-code|self-dev) v?(?P<version>[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?)(?: \([0-9a-f]{7,40}\))?$'
[[config]]
id = "settings"
path = "home:.qin-code/config.d/tools.toml"
format = "toml-merge"
[[config.ops]]
op = "append-unique"
key = ["hooks", "rules"]
event = "session_start"
value_json = '{"event":"session_start","command":"\"{{script_path}}\"","min_level":"minimal"}'
[[config.ops]]
op = "append-unique"
key = ["hooks", "rules"]
event = "turn_start"
value_json = '{"event":"turn_start","command":"\"{{script_path}}\"","min_level":"minimal"}'
[[config.ops]]
op = "append-unique"
key = ["hooks", "rules"]
event = "turn_end"
value_json = '{"event":"turn_end","command":"\"{{script_path}}\"","min_level":"minimal"}'
[[config.ops]]
op = "append-unique"
key = ["hooks", "rules"]
event = "session_end"
value_json = '{"event":"session_end","command":"\"{{script_path}}\"","min_level":"minimal"}'
[[config.ops]]
op = "append-unique"
key = ["hooks", "rules"]
event = "post_tool"
value_json = '{"event":"post_tool","command":"\"{{script_path}}\"","min_level":"standard"}'
[payload]
native_event = "/event"
session_id = "/session_id"
transcript_path = "/transcript_path"
tool_name = "/tool_name"
ok = "/ok"
[[native_events]]
name = "session_start"
hook_kind = "session_start"
enabled_by_default = true
[[native_events]]
name = "turn_start"
hook_kind = "prompt_submitted"
enabled_by_default = true
[[native_events]]
name = "turn_end"
hook_kind = "turn_done"
enabled_by_default = true
[[native_events]]
name = "session_end"
hook_kind = "session_end"
enabled_by_default = true
[[native_events]]
name = "post_tool"
hook_kind = "tool_end"
enabled_by_default = false
[[files]]
id = "hook"
source = "files/hook.sh.tmpl"
target = "install:qin-code-hook.sh"
mode = "0700"
[resume]
requires = ["session_id"]
path_root = "home"
[[resume.variants]]
id = "default"
binary = "qin-code"
argv = ["--resume", "{{session_id}}"]
requires = ["session_id"]
[[resume.variants]]
id = "self-dev"
binary = "self-dev"
argv = ["--resume", "{{session_id}}"]
requires = ["session_id"]
